    items_label: Миссии фонда
    items:
      - label: Миссия 1
        text: Содействие в восстановлении благополучия работников энергетической отрасли и их семей, пострадавших в результате событий, связанных с проведением специальной военной операции
      - label: Миссия 2
        text: Обеспечение необходимой медицинской, социальной и материальной помощи работникам отрасли для преодоления травм, полученных в результате событий, связанных с проведением специальной военной операции, и возвращения к полноценной жизни
      - label: Миссия 3
        text: Восстановление психологического здоровья и душевного равновесия работников энергетической отрасли, пострадавших в результате событий, связанных с проведением специальной военной операции
