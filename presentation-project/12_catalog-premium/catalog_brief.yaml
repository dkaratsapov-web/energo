# Каталог ГК «ЭНЕРГО ГРУПП» 2025 — редизайн с СОХРАНЕНИЕМ структуры и текста.
#
# Источник истины — утверждённый файл 01_current_deck_v34_APPROVED.pdf
# (32 полосы A4) и его тексты presentation-project/01_research/texts_by_page.json.
# Порядок полос, слова и снимки — как в оригинале. Типографские правки, и только
# они: кавычки «ёлочки», пробел после «ед.», перенос «ГОРИЗОНТАЛЬНО-» без
# висячего дефиса. Всё это проверяется сверкой со словами оригинала (verify).
#
# Сборка:  python3 .claude/skills/premium-deck/run.py build \
#            presentation-project/12_catalog-premium/catalog_brief.yaml \
#            --out presentation-project/12_catalog-premium

meta:
  title: ГК «ЭНЕРГО ГРУПП» — Комплексное строительство 2025
  short: ЭНЕРГО ГРУПП · 2025
  client: ГК «ЭНЕРГО ГРУПП»
  author: ГК «ЭНЕРГО ГРУПП»
  purpose: Печатный каталог компании (редизайн утверждённой версии v34)
  audience: Заказчики, партнёры, тендерные комиссии
  goal: Тот же каталог, но премиального уровня и готовый к типографии

format:
  kind: catalog
  page_mm: [210, 297]
  spreads: true

source:
  pdf: ../../01_current_deck_v34_APPROVED.pdf
  texts: ../01_research/texts_by_page.json

concept: B

brand:                       # замерено по утверждённому оригиналу
  accent: '#EA8729'          # фирменный оранжевый
  dark:   '#342C5D'          # фирменный фиолетовый, верх градиента полос
  dark2:  '#52469C'          # фирменный фиолетовый, низ градиента
  ink:    '#2A2440'          # текст на светлом — тёмно-фиолетовый, не чёрный
  paper:  '#F3F1EC'
  keep_dark: true

assets_dir: ../05_assets
logo: logo/energogroup.svg
map: map_ru.pkl
map_offset_mm: 34          # карта ниже заголовка «ГЕОГРАФИЯ ПРОЕКТОВ»

print:
  printer: не выбрана
  trim_mm: [210, 297]
  bleed_mm: 3
  safe_mm: 5
  confirmed: {}

