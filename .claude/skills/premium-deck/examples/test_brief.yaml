# Тестовая колода для проверки конвейера premium-deck.
# Факты и цифры — из согласованного каталога ГК «ЭНЕРГО ГРУПП» 2025.
# Снимки — из каталога (исходники 1240 px: для печати их мало, и preflight
# обязан это показать).

meta:
  title: ГК «ЭНЕРГО ГРУПП» — комплексное строительство в энергетике
  short: ЭНЕРГО ГРУПП · 2025
  client: ГК «ЭНЕРГО ГРУПП»
  author: ГК «ЭНЕРГО ГРУПП»
  date: Москва · 2025
  purpose: Презентация компании для заказчика на этапе выбора подрядчика
  audience: Технический директор и тендерный комитет сетевой компании
  goal: Включить ЭНЕРГО ГРУПП в короткий список подрядчиков и назначить встречу

concept: B          # A — редакционная сетка, B — ночная антиква, C — цветовое поле

brand:
  accent: '#E0872F'
  dark:   '#2E3154'
  ink:    '#1A1B26'
  paper:  '#F2F1EE'

assets_dir: ../../../../presentation-project/05_assets

print:
  printer: не выбрана
  trim_mm: [297, 167.06]
  bleed_mm: 3
  confirmed: {}      # ни один пункт типография ещё не подтвердила

slides:
  - layout: cover
    eyebrow: Комплексное строительство
    title: Энергетика под ключ
    subtitle: Проектирование, строительство и обслуживание объектов электросетевого хозяйства
    client: ГК «ЭНЕРГО ГРУПП»
    date: Москва · 2025
    image: photos/p12_ohl_winter.png
    focus: [0.62, 0.5]
    notes: Представиться, назвать задачу встречи — короткий список подрядчиков.

  - layout: statement
    eyebrow: Миссия
    title: Укрепляем энергетику, на которой держится экономика страны
    text: Участвуем в проектах, которые создают условия для постоянного развития экономики РФ, — от подготовки проекта до ввода объекта в эксплуатацию.

  - layout: stats
    eyebrow: Компания в цифрах
    title: Что уже построено
    items:
      - {value: '413 278', label: опор ЛЭП использовано при строительстве}
      - {value: '25 800 км', label: проводов протянуто на воздушных ЛЭП}
      - {value: '1 224', label: 'ПС, ТП и РП построено'}
      - {value: '502 000', label: объектов подключено к сетям}
      - {value: '339 км', label: ГНБ-прокола}

  - layout: number
    eyebrow: Команда
    value: '317'
    unit: сотрудников в штате
    title: Своя команда — от проекта до пусконаладки
    text: 24 руководителя, 32 инженера, 21 проектировщик, 144 монтажника, 32 строителя и 64 специалиста других профессий.

  - layout: section
    number: '02'
    eyebrow: Раздел
    title: Что мы строим

  - layout: points
    eyebrow: Направления работ
    title: Полный цикл в одной компании
    items:
      - {title: Воздушные и кабельные линии, text: 'Строительство ВЛ и КЛ, наружное электроосвещение и архитектурное освещение.'}
      - {title: Подстанции, text: 'Распределительные пункты и трансформаторные подстанции.'}
      - {title: ГНБ и ГНП, text: Бестраншейная прокладка коммуникаций.}
      - {title: Наладка и сервис, text: 'Пусконаладочные работы, электротехническая лаборатория, обслуживание.'}

  - layout: split_image
    eyebrow: Воздушные линии
    title: 25 800 км проводов на воздушных ЛЭП
    text: Строим и реконструируем воздушные линии электропередачи собственными бригадами и техникой.
    image: photos/p25_pole.png
    focus: [0.55, 0.5]
    side: right
    points:
      - 413 278 опор ЛЭП в построенных линиях
      - Собственная бурильно-крановая техника

  - layout: full_image
    eyebrow: Подстанции
    title: 1 224 подстанции, ТП и РП введены в работу
    text: Распределительные пункты и трансформаторные подстанции — от фундамента до пусконаладки.
    image: photos/p15_subst_pano.png
    focus: [0.5, 0.45]

  - layout: chart
    eyebrow: Динамика роста
    title: Объём работ в контрактах вырос в 3,2 раза
    text: С 2019 по 2025 год портфель контрактов рос каждый год.
    unit: млрд руб.
    highlight: 6
    data:
      - {label: '2019', value: 1500, display: '>1 500'}
      - {label: '2020', value: 1700, display: '>1 700'}
      - {label: '2021', value: 1850, display: '>1 850'}
      - {label: '2022', value: 2000, display: '>2 000'}
      - {label: '2023', value: 3500, display: '>3 500'}
      - {label: '2024', value: 4200, display: '>4 200'}
      - {label: '2025', value: 4800, display: '>4 800'}

  - layout: process
    eyebrow: Как мы ведём объект
    title: Один подрядчик на всех этапах
    highlight: 2
    steps:
      - {title: Проект, text: Изыскания и проектирование}
      - {title: Поставка, text: Поставка оборудования}
      - {title: Строительство, text: Монтаж собственными бригадами}
      - {title: Наладка, text: Пусконаладка и испытания}
      - {title: Сервис, text: Обслуживание электроустановок}

  - layout: gallery
    eyebrow: Парк техники
    title: 141 единица собственной техники
    text: 68 единиц спецтехники, 33 бурильно-крановые машины, 5 машин ГНБ.
    images:
      - {path: photos/p13_crane.png, focus: [0.4, 0.5]}
      - {path: photos/p11_excavator.png, focus: [0.4, 0.5]}
      - {path: photos/p19_hdd_pipes.png, focus: [0.5, 0.6]}

  - layout: quote
    text: Стать надёжным партнёром для заказчика и ответственным работодателем для каждого сотрудника.
    author: Цели компании
    role: ГК «ЭНЕРГО ГРУПП»

  - layout: closing
    eyebrow: Следующий шаг
    title: Обсудим ваш объект
    text: Подготовим технико-коммерческое предложение под вашу задачу.
    client: ГК «ЭНЕРГО ГРУПП»
    contacts:
      - ГК «ЭНЕРГО ГРУПП»
      - info@egroupp.ru
      - egroupp.ru
